<title>D7 처방 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 탭 3개(보드·상세·실험카드) + 넓은 작업 영역. 신호 색은 사분면에만 사용 */
:root {
  --bg: #f4f6f7; --surface: #ffffff; --ink: #16202a; --muted: #5d6b78; --line: #dce2e7;
  --accent: #0e6a74; --accent-soft: #e0eff0;
  --q-green: #2f8a57; --q-blue: #3a6fb5; --q-yellow: #b88a12; --q-red: #c2452f; --q-gray: #8a96a1;
  --q-green-soft: #e3f3e9; --q-blue-soft: #e4edf8; --q-yellow-soft: #f8f0d8; --q-red-soft: #f9e5e1; --q-gray-soft: #edf0f2;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10161b; --surface: #182128; --ink: #e5ebef; --muted: #9aa8b4; --line: #2b363f;
  --accent: #5cc0c9; --accent-soft: #163236;
  --q-green: #6fcf97; --q-blue: #7fa9e6; --q-yellow: #e3b94b; --q-red: #f08a75; --q-gray: #8f9ba6;
  --q-green-soft: #18321f; --q-blue-soft: #1a2738; --q-yellow-soft: #33290f; --q-red-soft: #3a211c; --q-gray-soft: #222b32;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10161b; --surface: #182128; --ink: #e5ebef; --muted: #9aa8b4; --line: #2b363f;
  --accent: #5cc0c9; --accent-soft: #163236;
  --q-green: #6fcf97; --q-blue: #7fa9e6; --q-yellow: #e3b94b; --q-red: #f08a75; --q-gray: #8f9ba6;
  --q-green-soft: #18321f; --q-blue-soft: #1a2738; --q-yellow-soft: #33290f; --q-red-soft: #3a211c; --q-gray-soft: #222b32;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
p { margin: 0; }
.muted { color: var(--muted); } .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.brand { display: grid; gap: 2px; } .brand small { color: var(--muted); }
nav.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 6px 14px; border-radius: 6px; font-weight: 500; }
nav.tabs a.on { background: var(--accent-soft); color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font-size: 22px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input[type=text], input[type=number], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { width: 100%; resize: vertical; min-height: 54px; }
button { font: inherit; cursor: pointer; border-radius: 6px; padding: 7px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.board { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 16px; }
.scatter svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
td.r, th.r { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--accent-soft); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.c-g { background: var(--q-green-soft); color: var(--q-green); } .c-b { background: var(--q-blue-soft); color: var(--q-blue); }
.c-y { background: var(--q-yellow-soft); color: var(--q-yellow); } .c-r { background: var(--q-red-soft); color: var(--q-red); }
.c-n { background: var(--q-gray-soft); color: var(--q-gray); }
.grade { font-weight: 700; font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.compare { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 8px; }
.reason { font-size: 13px; padding-left: 16px; margin: 0; display: grid; gap: 4px; }
.detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.metric { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; background: var(--surface); }
.metric .big { font-size: 22px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
.metric small { color: var(--muted); }
.gauge { height: 8px; background: var(--q-gray-soft); border-radius: 4px; position: relative; }
.gauge i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.gauge em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); left: 50%; }
.levers { display: grid; gap: 10px; }
.lever { display: grid; grid-template-columns: 120px minmax(0, 1fr) 150px; gap: 10px; align-items: center; }
.bars { display: grid; gap: 3px; }
.bar { display: grid; grid-template-columns: 54px minmax(0, 1fr) 64px; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.bar span.b { height: 10px; border-radius: 2px; }
.bar span.v { font-family: var(--mono); text-align: right; color: var(--ink); }
.lever .gain { font-size: 12px; text-align: right; }
.rx { border: 2px solid var(--accent); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; background: var(--accent-soft); }
.rx h3 { color: var(--accent); }
.form { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; align-items: start; }
.form label { color: var(--muted); padding-top: 6px; font-size: 13px; }
.saved { display: grid; gap: 10px; }
.saved article { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; background: var(--surface); }
.saved dl { margin: 0; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.saved dt { color: var(--muted); } .saved dd { margin: 0; }
.note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 6px; }
@media (max-width: 900px) { .board, .cards3, .tiles { grid-template-columns: 1fr 1fr; } .board { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .tiles, .cards3 { grid-template-columns: 1fr; } .lever { grid-template-columns: 1fr; } .lever .gain { text-align: left; } .form { grid-template-columns: 1fr; } .form label { padding-top: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.diag { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.fgroup { display: grid; gap: 10px; }
.fgroup h3 { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.fld { display: grid; gap: 4px; font-size: 13px; min-width: 0; }
.fld span { color: var(--muted); font-size: 12px; }
.fld input, .fld select { width: 100%; }
.toggles { display: flex; gap: 14px; align-items: center; font-size: 13px; }
.hero { border-radius: 10px; padding: 18px 20px; display: grid; gap: 10px; background: var(--accent-soft); border: 1px solid var(--line); }
.hero .flow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
.hero .now { font-family: var(--mono); font-size: 22px; }
.hero .arrow { color: var(--muted); font-size: 18px; }
.hero .after { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--accent); }
.hero .delta { font-family: var(--mono); font-weight: 700; color: var(--q-green); }
.verdict { font-size: 15px; font-weight: 500; }
.sols { display: grid; gap: 8px; }
.sol { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.sol.rec { border: 2px solid var(--accent); }
.sol .ic { font-size: 18px; text-align: center; }
.sol .what { display: grid; gap: 2px; min-width: 0; }
.sol .what small { color: var(--muted); }
.sol .money { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sol .money b { display: block; font-size: 15px; }
.sol .money small { color: var(--q-green); }
.sol.none { opacity: .55; }
.tag { font-size: 11px; font-weight: 700; color: var(--surface); background: var(--accent); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
.pos2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.src { font-size: 12px; color: var(--muted); }
@media (max-width: 900px) { .diag { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .fgrid, .pos2 { grid-template-columns: 1fr; } .sol { grid-template-columns: 22px minmax(0, 1fr); } .sol .money { grid-column: 2; text-align: left; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>D7 처방 보드</h1><small>게임 D7 데이터를 넣으면, 무엇을 하면 90일 매출이 얼마나 될지 알려 드려요 · 앵날다쏘 4조</small></div>
    <nav class="tabs" aria-label="화면">
      <a href="#diag" data-v="diag">① 게임 진단</a>
      <a href="#board" data-v="board">② 전체 게임 비교</a>
      <a href="#cards" data-v="cards">③ 실험카드 <span id="cardCount"></span></a>
    </nav>
  </header>

  <section id="v-diag" hidden>
    <div class="diag">
      <form class="panel" id="form" autocomplete="off">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
          <h2>게임 D7 데이터</h2>
          <label class="fld" style="min-width:220px"><span>예시 게임 불러오기</span><select id="exSel"></select></label>
        </div>
        <div class="fgroup"><h3>게임 기본 정보 · 비교 셀을 정해요</h3>
          <div class="fgrid">
            <label class="fld"><span>장르</span><select id="i_genre"></select></label>
            <label class="fld"><span>과금 방식</span><select id="i_mm"><option>Free</option><option>Freemium</option><option>Paid</option><option>Subscription</option></select></label>
            <label class="fld"><span>퍼블리셔 규모</span><select id="i_pub"></select></label>
            <label class="fld"><span>주 지역</span><select id="i_reg"></select></label>
            <label class="fld"><span>멀티플레이</span><select id="i_mp"></select></label>
            <div class="fld"><span>수익화 구조</span><div class="toggles"><label><input type="checkbox" id="i_ads"> 광고</label><label><input type="checkbox" id="i_iap"> 인앱결제</label></div></div>
          </div></div>
        <div class="fgroup"><h3>D7 지표 · 품질과 마케팅을 진단해요</h3>
          <div class="fgrid">
            <label class="fld"><span>초기 마케팅비 ($)</span><input type="number" id="i_mkt" min="1" step="1"></label>
            <label class="fld"><span>충돌률 (%)</span><input type="number" id="i_crash" min="0" step="0.01"></label>
            <label class="fld"><span>세션 길이 (분)</span><input type="number" id="i_sess" min="0.1" step="0.1"></label>
            <label class="fld"><span>하루 세션 수 (회)</span><input type="number" id="i_daily" min="0.1" step="0.01"></label>
            <label class="fld"><span>업데이트 간격 (일)</span><input type="number" id="i_upd" min="1" step="1"></label>
            <label class="fld"><span>출시 전 위시리스트 (건)</span><input type="number" id="i_wish" min="1" step="1"></label>
            <label class="fld"><span>앱 용량 (MB)</span><input type="number" id="i_apk" min="1" step="1"></label>
          </div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" type="submit">진단하기</button><button type="button" id="resetEx">예시로 되돌리기</button></div>
        <p class="src" id="formNote"></p>
      </form>
      <div id="result" style="display:grid;gap:14px;min-width:0"></div>
    </div>
  </section>

  <section id="v-board" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="panel">
      <div class="filters">
        <select id="fGenre" aria-label="장르"></select>
        <select id="fChan" aria-label="수익화 구조 (광고/IAP 조합)"></select>
        <select id="fQuad" aria-label="사분면"></select>
        <select id="fGrade" aria-label="등급"><option value="">등급 전체</option><option>고</option><option>중</option><option>저</option><option>판단 보류</option></select>
        <input type="text" id="fId" placeholder="게임 ID 검색" aria-label="게임 ID 검색">
        <select id="fSort" aria-label="우선순위 기준"><option value="team">우선순위: 팀 점수 (품질 × 마케팅 여유)</option><option value="gap">우선순위: 심각성 (품질·마케팅비 불균형)</option><option value="impact">우선순위: 영향도 × 실행 가능성</option></select>
        <span class="muted" id="fCount"></span>
      </div>
    </div>
    <div class="board">
      <div class="panel scatter">
        <h2>품질 × 마케팅비 매트릭스</h2>
        <p class="muted" style="font-size:12px">두 축 모두 같은 셀(장르 × 수익화 구조[광고/IAP 조합]) 안 백분위. 점을 누르면 그 게임을 진단해요</p>
        <div id="scatter"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="panel">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline">
          <h2>우선순위 목록</h2><span class="muted" style="font-size:12px" id="sortNote"></span>
        </div>
        <div class="tbl" style="max-height:460px;overflow:auto"><table id="list"></table></div>
        <button id="more">더 보기</button>
        <div class="compare" id="compare"></div>
      </div>
    </div>
  </section>

  <section id="v-cards" hidden>
    <div class="panel" id="cardForm"></div>
    <div class="panel"><h2>저장한 실험카드</h2><div class="saved" id="saved"></div></div>
  </section>

  <p class="note" id="foot"></p>
</div>

<script>
const ENG = __ENGINE__;
const RAW = __DATA__;
const G = RAW.rows.map(r => Object.fromEntries(RAW.cols.map((c, i) => [c, r[i]])));
const CELL = Object.fromEntries(RAW.cells.map(c => [c["비교셀"], c]));
const BY = Object.fromEntries(G.map(g => [g.game_id, g]));
const QUAD = {
  "🟢": { k: "g", name: "기회 · 예산 증액", color: "var(--q-green)" },
  "🔵": { k: "b", name: "유지", color: "var(--q-blue)" },
  "🟡": { k: "y", name: "품질 먼저", color: "var(--q-yellow)" },
  "🔴": { k: "r", name: "위험 · 품질 개선 + 예산 재검토", color: "var(--q-red)" },
  "⚪": { k: "n", name: "마케팅비 없음 · 판단 보류", color: "var(--q-gray)" },
};
const LEVER = {
  "충돌률": { icon: "💥", feas: "1–2주", unit: "%" }, "플레이타임": { icon: "🕐", feas: "2–4주", unit: "분" },
  "업데이트": { icon: "🔄", feas: "4주", unit: "일" }, "예산": { icon: "💰", feas: "즉시~2주" }, "유지": { icon: "✅" },
};
const $ = s => document.querySelector(s);
const FEASW = { "충돌률": 1.0, "예산": 0.9, "업데이트": 0.7, "플레이타임": 0.6, "유지": 0 };
const sortFn = () => { const v = $("#fSort").value;
  if (v === "impact") return (a, b) => impactScore(b) - impactScore(a);
  if (v === "gap") return (a, b) => Math.abs(b["불균형"] ?? 0) - Math.abs(a["불균형"] ?? 0) || (b["예상추가매출"] || 0) - (a["예상추가매출"] || 0);
  return (a, b) => (b["우선순위점수"] ?? -1) - (a["우선순위점수"] ?? -1); };
const impactScore = g => (g["예상추가매출"] || 0) * (FEASW[g["솔루션"]] ?? 0);
const usd = v => v == null ? "–" : "$" + Math.round(v).toLocaleString("en-US");
const f1 = v => v == null ? "–" : (+v).toFixed(1);
const chip = q => `<span class="chip c-${QUAD[q].k}">${q} ${QUAD[q].name}</span>`;
let selected = new Set(), shown = 40, current = null;
let store = []; try { store = JSON.parse(localStorage.getItem("d7cards") || "[]"); } catch (e) { store = []; }
const saveStore = () => { try { localStorage.setItem("d7cards", JSON.stringify(store)); } catch (e) {} };

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
function opts(sel, label, vals) { sel.innerHTML = `<option value="">${label}</option>` + vals.map(v => `<option>${v}</option>`).join(""); }
opts($("#fGenre"), "장르 전체", [...new Set(G.map(g => g.genre))].sort());
opts($("#fChan"), "수익화 구조(광고/IAP) 전체", ["광고+IAP", "광고만", "IAP만", "없음"]);
$("#fQuad").innerHTML = `<option value="">사분면 전체</option>` + Object.entries(QUAD).map(([q, v]) => `<option value="${q}">${q} ${v.name}</option>`).join("");

function filtered() {
  const ge = $("#fGenre").value, ch = $("#fChan").value, qu = $("#fQuad").value, gr = $("#fGrade").value, id = $("#fId").value.trim().toUpperCase();
  return G.filter(g => (!ge || g.genre === ge) && (!ch || g["채널"] === ch) && (!qu || g["사분면"] === qu) && (!gr || g["등급"] === gr) && (!id || g.game_id.includes(id)))
    .sort(sortFn());
}
function improveText(g) {
  const s = g["솔루션"];

const FIELDS = ["대상", "레버", "가설", "실행", "지표", "기간", "효과", "근거"];
const LABELS = { 대상: "대상", 레버: "레버", 가설: "가설", 실행: "실행", 지표: "성공 지표", 기간: "관찰 기간", 효과: "예상 효과", 근거: "근거" };
function cardFrom(d, k) {
  const s = d.sols.find(x => x.k === k) || null, name = loadedId && !dirty ? loadedId : "입력한 게임";
  const base = { 대상: `${name} (${d.ref}, ${d.quad} ${QUAD[d.quad].name})`, 근거: verdictOf(d).replace(/<[^>]+>/g, "") };
  const eff = s && d.cur != null ? `예측 90일 매출 ${usd(d.cur)} → ${usd(s.after)} (+${usd(s.after - d.cur)}, 상관 기반 예상치)` : "–";
  if (!s || !s.ok) return { ...base, 레버: "유지", 가설: "현재 품질·예산 균형 유지 시 매출 유지", 실행: "주간 지표 모니터링 (충돌률·플레이타임·ROAS)", 지표: "충돌률 · 플레이타임 · ROAS", 기간: "4주", 효과: "–" };
  const T = {
    "충돌률": { 가설: `충돌률을 ${s.from}% → 셀 중앙값 ${s.to}%로 낮추면 이용시간과 매출이 개선될 것`, 실행: "상위 크래시 원인 3개 핫픽스 → 일부 이용자 단계적 배포", 지표: `충돌률 ${s.to}% 이하 · 하루 플레이타임 · D30 매출`, 기간: "2주" },
    "플레이타임": { 가설: `하루 플레이타임 ${s.from}분 → 셀 중앙값 ${s.to}분으로 늘리면 매출이 개선될 것`, 실행: s.how.split(" · ")[0] + " A/B", 지표: "하루 세션 수 · 세션 길이 · D30 매출", 기간: "4주" },
    "업데이트": { 가설: `업데이트 간격 ${s.from}일 → 셀 중앙값 ${s.to}일로 줄이면 매출이 개선될 것`, 실행: "소규모 콘텐츠 업데이트 주기 단축 (격주 패치)", 지표: "업데이트 간격 · 복귀 이용자 · D30 매출", 기간: "4주" },
    "예산": { 가설: `품질은 비슷한 게임 중 상위인데 마케팅비는 적음 → 마케팅비 +50% 시 매출 증가 기대 (${s.extra})`, 실행: `마케팅비 $${s.from} → $${s.to} 단계 집행 (1주 단위 점검)`, 지표: "실제 ROAS · 유료 설치 수 · D30 매출", 기간: "2–4주" },
  }[k];

}
